name: python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app/ tests/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Debug secrets
        run: |
          echo "EC2_HOST is set: ${{ secrets.EC2_HOST != '' }}"
          echo "EC2_USER is set: ${{ secrets.EC2_USER != '' }}"
          echo "EC2_KEY is set: ${{ secrets.EC2_KEY != '' }}"
          echo "EC2_USER value: ${{ secrets.EC2_USER }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest
            docker stop calculator || true
            docker rm calculator || true
            docker run -d --name calculator -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest
